<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wilson Ticket</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ticket">
    <meta name="theme-color" content="#5F8A8B">
    <link rel="stylesheet" href="../css/tabler-icons.min.css">
    <script src="../env.js"></script>
    <script src="../js/supabase.min.js"></script>
    <style>
        :root {
            --bar:     #5F8A8B;
            --bg:      #FFFFFF;
            --field:   #F4F4F4;
            --border:  #5F8A8B;
            --text:    #2B2B2B;
            --muted:   #8A8A8A;
            --date:    #1A1AB8;
            --accent:  #E07A2E;
            --ok:      #2D7D4F;
            --warn:    #B7791F;
            --err:     #B91C1C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); font-size: 16px;
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
        }
        header {
            background: var(--bar); color: #fff; padding: 6px 10px;
            padding-top: calc(6px + env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 5;
        }
        header button { background: none; border: 0; color: #fff; font-size: 14px; }

        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; }
        .tabs button {
            height: 64px; border: 1px solid #ccc; background: #F2F2F2; font-size: 30px; color: #555;
        }
        .tabs button.active { color: var(--accent); }

        .row { display: flex; align-items: center; gap: 8px; padding: 10px 6px; min-height: 64px; }
        .row > label { flex: 1; color: var(--text); }
        .row .ctrl { flex: 1.15; display: flex; gap: 6px; justify-content: flex-end; }
        input, select, textarea {
            font: inherit; color: var(--text); width: 100%;
            border: 1px solid var(--border); background: #fff; padding: 10px; border-radius: 2px;
        }
        input[type=date] { color: var(--date); }
        input.readonly { background: var(--field); border-color: transparent; text-align: right; }
        select { background: #F7F7F7; border-color: #E2E2E2; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .valuta { flex: 1; background: var(--field); color: var(--muted); padding: 12px 10px; }
        #importo { text-align: right; }

        details { margin: 6px 0; }
        summary {
            background: var(--field); padding: 14px 12px; font-size: 20px; font-weight: 700;
            list-style: none; display: flex; justify-content: space-between; align-items: center;
        }
        summary::-webkit-details-marker { display: none; }
        summary i { color: #bbb; transition: transform .2s; }
        details[open] summary i { transform: rotate(180deg); }
        details .row { min-height: 56px; }

        .copy { border: 0; background: none; color: var(--bar); font-size: 20px; padding: 0 2px; }

        .camera-box { padding: 10px 6px; display: grid; gap: 8px; }
        .camera-box .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        .btn {
            border: 0; border-radius: 6px; padding: 14px; font: inherit; font-weight: 600;
            background: var(--bar); color: #fff; display: flex; gap: 8px; align-items: center; justify-content: center;
        }
        .btn.secondary { background: #E8EFEF; color: var(--bar); }
        .btn:disabled { opacity: .5; }
        #anteprima { max-width: 100%; max-height: 260px; object-fit: contain; display: none; margin: 0 auto; border: 1px solid #ddd; }

        .stato { margin: 0 6px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none; }
        .stato.info { display: block; background: #EEF4F4; color: var(--bar); }
        .stato.ok   { display: block; background: #E7F4EC; color: var(--ok); }
        .stato.warn { display: block; background: #FDF6E3; color: var(--warn); }
        .stato.err  { display: block; background: #FDECEC; color: var(--err); }
        .stato ul { margin: 6px 0 0 18px; }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .azioni {
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #ddd;
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 2fr; gap: 8px;
        }

        h2 { font-size: 16px; color: var(--muted); padding: 18px 8px 6px; font-weight: 600; }
        .lista { list-style: none; }
        .lista li { padding: 10px 8px; border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        .lista li .info { flex: 1; min-width: 0; }
        .lista li .titolo { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lista li .sub { font-size: 13px; color: var(--muted); }
        .lista li .imp { font-weight: 700; white-space: nowrap; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #FDF6E3; color: var(--warn); }
        .badge.inserito { background: #E7F4EC; color: var(--ok); }

        #login { display: none; padding: 40px 20px; text-align: center; }
        body.locked #app { display: none; }
        body.locked #login { display: block; }
    </style>
</head>
<body class="locked">

<header>
    <span>Immissione consuntivi</span>
    <button id="utente" onclick="logout()">—</button>
</header>

<div id="login">
    <p style="margin-bottom:20px">Accedi con l'account Google di Wilson.</p>
    <button class="btn" onclick="login()"><i class="ti ti-brand-google"></i> Accedi con Google</button>
</div>

<div id="app">
    <div class="tabs">
        <button id="tab-cat" class="active" title="Categoria" onclick="document.getElementById('categoria').focus()"><i class="ti ti-tools-kitchen-2"></i></button>
        <button title="Utente" disabled><i class="ti ti-user"></i></button>
        <button title="Foto" onclick="scatta()"><i class="ti ti-camera"></i></button>
        <button title="Nuovo" onclick="nuovo()"><i class="ti ti-file-plus"></i></button>
    </div>

    <div class="camera-box">
        <div class="btns">
            <button class="btn" onclick="scatta()"><i class="ti ti-camera"></i> Fotografa documento</button>
            <button class="btn secondary" onclick="galleria()"><i class="ti ti-photo"></i> Galleria</button>
        </div>
        <img id="anteprima" alt="Anteprima documento">
        <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
        <input type="file" id="file-galleria" accept="image/*" hidden>
    </div>

    <div id="stato" class="stato"></div>

    <form id="form" onsubmit="return false">
        <input type="hidden" id="id">
        <div class="row">
            <label for="categoria">Categoria</label>
            <div class="ctrl">
                <select id="categoria">
                    <option>Vitto</option><option>Alloggio</option><option>Carburante</option>
                    <option>Pedaggi</option><option>Parcheggi</option><option>Trasporti</option><option>Altro</option>
                </select>
            </div>
        </div>
        <div class="row">
            <label for="data_registrazione">Data registrazione</label>
            <div class="ctrl"><input type="date" id="data_registrazione"></div>
        </div>
        <div class="row">
            <div class="valuta"><span id="valuta-label">Euro - EUR</span><input type="hidden" id="valuta" value="EUR"></div>
            <div class="ctrl" style="flex:1">
                <input id="importo" inputmode="decimal" placeholder="Importo" autocomplete="off">
                <button type="button" class="copy" data-copy="importo" title="Copia"><i class="ti ti-copy"></i></button>
            </div>
        </div>
        <div class="row">
            <label for="tipo_documento">Tipo documento</label>
            <div class="ctrl">
                <select id="tipo_documento"><option>Fattura</option><option>Scontrino</option><option>Ricevuta</option></select>
            </div>
        </div>
        <div class="row">
            <label for="pagamento" style="flex:.6">Pagamento</label>
            <div class="ctrl" style="flex:2">
                <select id="pagamento" style="flex:1.3;min-width:0"><option>Contanti</option><option>Carta di credito</option><option>Bancomat</option><option>Altro</option></select>
                <input type="date" id="data_pagamento">
            </div>
        </div>
        <div class="row">
            <label for="num_allegati">Num. Alleg.</label>
            <div class="ctrl"><input id="num_allegati" class="readonly" type="number" min="1" value="1"></div>
        </div>

        <details id="sez-documento" open>
            <summary>Documento <i class="ti ti-chevron-down"></i></summary>
            <div class="row">
                <label for="descrizione">Descrizione</label>
                <div class="ctrl" style="flex:2">
                    <input id="descrizione" placeholder="Ragione sociale">
                    <button type="button" class="copy" data-copy="descrizione" title="Copia"><i class="ti ti-copy"></i></button>
                </div>
            </div>
            <div class="row">
                <label for="numero_documento">Numero</label>
                <div class="ctrl" style="flex:2">
                    <input id="numero_documento">
                    <button type="button" class="copy" data-copy="numero_documento" title="Copia"><i class="ti ti-copy"></i></button>
                </div>
            </div>
            <div class="row">
                <label for="data_documento">Data documento</label>
                <div class="ctrl"><input type="date" id="data_documento"></div>
            </div>
            <div class="row">
                <label for="partita_iva">P. IVA</label>
                <div class="ctrl" style="flex:2">
                    <input id="partita_iva" inputmode="numeric">
                    <button type="button" class="copy" data-copy="partita_iva" title="Copia"><i class="ti ti-copy"></i></button>
                </div>
            </div>
            <div class="row">
                <label for="citta">Città</label>
                <div class="ctrl" style="flex:2"><input id="citta"></div>
            </div>
        </details>

        <div class="row" style="align-items:flex-start">
            <label for="note" style="flex:.45;padding-top:10px">Note</label>
            <div class="ctrl" style="flex:2">
                <textarea id="note" rows="2"></textarea>
                <button type="button" class="copy" data-copy="note" title="Copia"><i class="ti ti-copy"></i></button>
            </div>
        </div>
    </form>

    <h2>Ultimi documenti</h2>
    <ul id="lista" class="lista"></ul>

    <div class="azioni">
        <button class="btn secondary" onclick="nuovo()"><i class="ti ti-eraser"></i> Nuovo</button>
        <button class="btn" id="btn-salva" onclick="salva()"><i class="ti ti-device-floppy"></i> Salva</button>
    </div>
</div>

<script>
const SESSION_KEY   = 'wilson_session_v1';     // condivisa con il cruscotto Wilson (stessa origine)
const ALLOWED_EMAIL = 'loriscuba@gmail.com';
const BUCKET        = 'app-ticket';
const CAMPI = ['id', 'categoria', 'data_registrazione', 'valuta', 'importo', 'tipo_documento', 'pagamento',
               'data_pagamento', 'num_allegati', 'descrizione', 'numero_documento', 'data_documento',
               'partita_iva', 'citta', 'note'];

const sb = window.supabase.createClient(window.__env.SUPABASE_URL, window.__env.SUPABASE_KEY, {
    auth: { persistSession: false, detectSessionInUrl: true },
});
const $ = id => document.getElementById(id);

let fotoBlob = null;      // foto ridimensionata, da caricare al salvataggio
let fotoPath = null;      // percorso nello Storage dopo l'upload
let estrazione = null;    // risposta grezza del modello

// ── Accesso ─────────────────────────────────────────────────────────────────
function salvaSessione(s) {
    try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
            access_token: s.access_token, refresh_token: s.refresh_token, expires_at: s.expires_at,
        }));
    } catch {}
}

function sblocca(session) {
    salvaSessione(session);
    $('utente').textContent = session.user.user_metadata?.full_name || session.user.email;
    document.body.classList.remove('locked');
    caricaLista();
}

async function avvio() {
    sb.auth.onAuthStateChange((event, session) => {
        if (event === 'TOKEN_REFRESHED' && session) salvaSessione(session);
        if (event === 'SIGNED_IN' && session?.user?.email === ALLOWED_EMAIL) sblocca(session);
    });
    try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (saved) {
            const { data } = await sb.auth.setSession(saved);
            if (data?.session?.user?.email === ALLOWED_EMAIL) return sblocca(data.session);
        }
    } catch {}
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user?.email === ALLOWED_EMAIL) sblocca(session);
}

function login() {
    sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: location.href.split('?')[0].split('#')[0] },
    });
}

function logout() {
    if (!confirm('Uscire?')) return;
    try { localStorage.removeItem(SESSION_KEY); } catch {}
    sb.auth.signOut();
    document.body.classList.add('locked');
}

// ── Messaggi ────────────────────────────────────────────────────────────────
function stato(tipo, html) {
    const el = $('stato');
    el.className = 'stato ' + (tipo || '');
    el.innerHTML = html || '';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── Form ────────────────────────────────────────────────────────────────────
const oggi = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD locale

function nuovo() {
    $('form').reset();
    $('id').value = '';
    $('data_registrazione').value = oggi();
    $('data_pagamento').value = oggi();
    $('num_allegati').value = 1;
    $('valuta').value = 'EUR';
    aggiornaValuta();
    $('anteprima').style.display = 'none';
    fotoBlob = fotoPath = estrazione = null;
    stato();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function aggiornaValuta() {
    const v = $('valuta').value || 'EUR';
    $('valuta-label').textContent = (v === 'EUR' ? 'Euro' : v) + ' - ' + v;
}

function impostaSelect(id, valore) {
    if (!valore) return;
    const sel = $(id);
    if (![...sel.options].some(o => o.value === valore)) sel.add(new Option(valore));
    sel.value = valore;
}

function compila(c) {
    if (c.categoria) impostaSelect('categoria', c.categoria);
    if (c.tipo_documento) impostaSelect('tipo_documento', c.tipo_documento);
    if (c.pagamento) impostaSelect('pagamento', c.pagamento);
    if (c.importo != null) $('importo').value = Number(c.importo).toLocaleString('it-IT', { minimumFractionDigits: 2 });
    if (c.valuta) { $('valuta').value = c.valuta.toUpperCase(); aggiornaValuta(); }
    $('descrizione').value = c.descrizione || '';
    $('numero_documento').value = c.numero_documento || '';
    $('partita_iva').value = c.partita_iva || '';
    $('citta').value = c.citta || '';
    if (c.data_documento) {
        $('data_documento').value = c.data_documento;
        $('data_pagamento').value = c.data_documento;
    }
    $('note').value = c.citta || '';
}

function leggiForm() {
    const o = {};
    for (const k of CAMPI) o[k] = $(k).value.trim();
    o.importo = o.importo.replace(/\./g, '').replace(',', '.');   // 1.234,50 → 1234.50
    if (o.importo && isNaN(Number(o.importo))) throw new Error('Importo non valido');
    return o;
}

document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const v = $(b.dataset.copy).value;
    try { await navigator.clipboard.writeText(v); b.innerHTML = '<i class="ti ti-check"></i>'; }
    catch { $(b.dataset.copy).select(); }
    setTimeout(() => b.innerHTML = '<i class="ti ti-copy"></i>', 1200);
}));

// ── Foto ────────────────────────────────────────────────────────────────────
function scatta()   { $('file-camera').click(); }
function galleria() { $('file-galleria').click(); }
$('file-camera').addEventListener('change', e => gestisciFoto(e.target.files[0]));
$('file-galleria').addEventListener('change', e => gestisciFoto(e.target.files[0]));

// Ridimensiona a max 1800px lato lungo, JPEG: foto leggibile ma payload contenuto.
function ridimensiona(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            const max = 1800;
            const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
            const c = document.createElement('canvas');
            c.width = Math.round(img.naturalWidth * k);
            c.height = Math.round(img.naturalHeight * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            c.toBlob(b => b ? resolve(b) : reject(new Error('Conversione foto fallita')), 'image/jpeg', 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Formato foto non supportato')); };
        img.src = url;
    });
}

const blobToBase64 = blob => new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.readAsDataURL(blob);
});

async function gestisciFoto(file) {
    if (!file) return;
    const idCorrente = $('id').value;
    try {
        stato('info', '<i class="ti ti-loader-2 spin"></i> Lettura del documento in corso…');
        fotoBlob = await ridimensiona(file);
        fotoPath = null;
        $('anteprima').src = URL.createObjectURL(fotoBlob);
        $('anteprima').style.display = 'block';

        const { data, error } = await sb.functions.invoke('app-ticket', {
            body: { image: await blobToBase64(fotoBlob), media_type: 'image/jpeg' },
        });
        if (error) {
            let msg = error.message;
            try { msg = (await error.context.json()).error || msg; } catch {}
            throw new Error(msg);
        }
        estrazione = data.campi;
        if (!idCorrente) nuovoMantenendoFoto();
        compila(estrazione);

        const avvisi = estrazione.avvisi || [];
        const tipo = estrazione.confidenza === 'alta' && !avvisi.length ? 'ok' : 'warn';
        stato(tipo, `<b>Letto: ${esc(estrazione.descrizione || 'emittente non trovato')}</b> — controlla i campi e salva.` +
            (avvisi.length ? '<ul>' + avvisi.map(a => `<li>${esc(a)}</li>`).join('') + '</ul>' : ''));
    } catch (err) {
        stato('err', 'Errore: ' + esc(err.message));
    } finally {
        $('file-camera').value = $('file-galleria').value = '';
    }
}

function nuovoMantenendoFoto() {
    const b = fotoBlob, src = $('anteprima').src;
    nuovo();
    fotoBlob = b;
    $('anteprima').src = src;
    $('anteprima').style.display = 'block';
}

// ── Salvataggio ─────────────────────────────────────────────────────────────
async function salva() {
    const btn = $('btn-salva');
    btn.disabled = true;
    try {
        const p = leggiForm();
        if (!p.importo) throw new Error("Manca l'importo");
        if (fotoBlob && !fotoPath) {
            const d = p.data_documento || oggi();
            const path = `${d.slice(0, 4)}/${d.slice(5, 7)}/${crypto.randomUUID()}.jpg`;
            const { error } = await sb.storage.from(BUCKET).upload(path, fotoBlob, { contentType: 'image/jpeg' });
            if (error) throw new Error('Upload foto: ' + error.message);
            fotoPath = path;
        }
        if (fotoPath) p.foto_path = fotoPath;
        if (estrazione) p.estrazione = estrazione;
        const { data, error } = await sb.rpc('app_ticket_salva', { p });
        if (error) throw new Error(error.message);
        $('id').value = data.id;
        stato('ok', `Salvato (n. ${data.id}).`);
        caricaLista();
    } catch (err) {
        stato('err', 'Errore: ' + esc(err.message));
    } finally {
        btn.disabled = false;
    }
}

// ── Lista ───────────────────────────────────────────────────────────────────
let elenco = [];

async function caricaLista() {
    const { data, error } = await sb.rpc('app_ticket_lista', { p_limit: 30 });
    if (error) { $('lista').innerHTML = `<li class="sub">${esc(error.message)}</li>`; return; }
    elenco = data || [];
    $('lista').innerHTML = elenco.map((t, i) => `
        <li>
            <div class="info" onclick="apri(${i})">
                <div class="titolo">${esc(t.descrizione || '—')}</div>
                <div class="sub">${esc(t.data_documento ? new Date(t.data_documento).toLocaleDateString('it-IT') : '')}
                    · ${esc(t.categoria || '')} · ${esc(t.citta || '')}</div>
            </div>
            <span class="imp">${t.importo != null ? Number(t.importo).toLocaleString('it-IT', { style: 'currency', currency: t.valuta || 'EUR' }) : ''}</span>
            <span class="badge ${t.stato === 'inserito' ? 'inserito' : ''}" onclick="cambiaStato(${i})">${t.stato === 'inserito' ? 'inserito' : 'da inserire'}</span>
        </li>`).join('') || '<li class="sub">Nessun documento salvato.</li>';
}

async function apri(i) {
    const t = elenco[i];
    nuovo();
    for (const k of CAMPI) if (t[k] != null) $(k).value = k === 'importo' ? Number(t[k]).toLocaleString('it-IT', { minimumFractionDigits: 2 }) : t[k];
    impostaSelect('categoria', t.categoria);
    impostaSelect('tipo_documento', t.tipo_documento);
    impostaSelect('pagamento', t.pagamento);
    aggiornaValuta();
    fotoPath = t.foto_path;
    if (t.foto_path) {
        const { data } = await sb.storage.from(BUCKET).createSignedUrl(t.foto_path, 600);
        if (data?.signedUrl) { $('anteprima').src = data.signedUrl; $('anteprima').style.display = 'block'; }
    }
}

async function cambiaStato(i) {
    const t = elenco[i];
    const { error } = await sb.rpc('app_ticket_salva', {
        p: { ...t, stato: t.stato === 'inserito' ? 'da_inserire' : 'inserito' },
    });
    if (error) return stato('err', 'Errore: ' + esc(error.message));
    caricaLista();
}

nuovo();
avvio();
</script>
</body>
</html>
